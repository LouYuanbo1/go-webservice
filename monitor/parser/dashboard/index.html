<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prometheus 监控仪表盘</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #3b82f6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 1.5rem 2rem;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header h1 i {
            font-size: 1.5rem;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-connected {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .status-disconnected {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
        }

        .status-connected i, .status-disconnected i {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .card-icon-blue {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--info-color);
        }

        .card-icon-green {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .card-icon-purple {
            background-color: rgba(139, 92, 246, 0.2);
            color: var(--secondary-color);
        }

        .card-icon-orange {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .card-change {
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .change-up {
            color: var(--success-color);
        }

        .change-down {
            color: var(--danger-color);
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-card {
            background-color: var(--bg-card);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chart-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .metrics-table {
            background-color: var(--bg-card);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .table-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td {
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        tr:hover {
            background-color: var(--bg-card-hover);
        }

        .metric-name {
            font-weight: 500;
            color: var(--primary-color);
        }

        .metric-value {
            font-family: 'Monaco', 'Consolas', monospace;
            font-weight: 600;
        }

        .metric-type {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .type-counter {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success-color);
        }

        .type-gauge {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--info-color);
        }

        .type-histogram {
            background-color: rgba(139, 92, 246, 0.2);
            color: var(--secondary-color);
        }

        .type-summary {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--warning-color);
        }

        .scrollbar::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: var(--bg-card);
            border-radius: 4px;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .summary-cards {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>
                <i class="fas fa-chart-line"></i>
                Prometheus 监控仪表盘
            </h1>
            <div class="connection-status status-disconnected" id="connectionStatus">
                <i class="fas fa-circle"></i>
                <span>未连接</span>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="summary-cards">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">总请求数</span>
                    <div class="card-icon card-icon-blue">
                        <i class="fas fa-server"></i>
                    </div>
                </div>
                <div class="card-value" id="totalRequests">0</div>
                <div class="card-change change-up" id="requestsChange">
                    <i class="fas fa-arrow-up"></i>
                    <span>+0 (0%)</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">平均响应时间</span>
                    <div class="card-icon card-icon-green">
                        <i class="fas fa-clock"></i>
                    </div>
                </div>
                <div class="card-value" id="avgResponseTime">0.00</div>
                <div class="card-change change-down" id="responseChange">
                    <i class="fas fa-arrow-down"></i>
                    <span>-0ms</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">活跃连接数</span>
                    <div class="card-icon card-icon-purple">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
                <div class="card-value" id="activeConnections">0</div>
                <div class="card-change change-up" id="connectionsChange">
                    <i class="fas fa-arrow-up"></i>
                    <span>+0</span>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">数据更新频率</span>
                    <div class="card-icon card-icon-orange">
                        <i class="fas fa-refresh"></i>
                    </div>
                </div>
                <div class="card-value" id="updateFrequency">0</div>
                <div class="card-change change-up">
                    <i class="fas fa-check-circle"></i>
                    <span>实时更新</span>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <span class="chart-title">请求数趋势</span>
                    <div class="chart-actions">
                        <button class="btn btn-secondary" onclick="toggleTimeRange(60)">1分钟</button>
                        <button class="btn btn-primary" onclick="toggleTimeRange(300)">5分钟</button>
                        <button class="btn btn-secondary" onclick="toggleTimeRange(600)">10分钟</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="requestsChart"></canvas>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-header">
                    <span class="chart-title">响应时间分布</span>
                </div>
                <div class="chart-container">
                    <canvas id="responseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="metrics-table">
            <div class="table-header">
                <span class="table-title">指标列表</span>
                <button class="btn btn-primary" onclick="refreshMetrics()">
                    <i class="fas fa-refresh"></i>
                    刷新
                </button>
            </div>
            <div style="overflow-x: auto;" class="scrollbar">
                <table id="metricsTable">
                    <thead>
                        <tr>
                            <th>指标名称</th>
                            <th>类型</th>
                            <th>标签</th>
                            <th>数值</th>
                            <th>帮助信息</th>
                        </tr>
                    </thead>
                    <tbody id="metricsTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-secondary);">
                                等待数据...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let ws;
        let requestsChart, responseChart;
        let requestsData = [];
        let responseData = [];
        let maxDataPoints = 60;
        let lastTotalRequests = 0;
        let lastAvgResponseTime = 0;

        function initCharts() {
            const ctx1 = document.getElementById('requestsChart').getContext('2d');
            requestsChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '请求数',
                        data: [],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false,
                        },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f1f5f9',
                            bodyColor: '#94a3b8',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: '#334155',
                                drawBorder: false,
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 10 },
                            }
                        },
                        y: {
                            grid: {
                                color: '#334155',
                                drawBorder: false,
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 10 },
                            },
                            beginAtZero: true,
                        }
                    }
                }
            });

            const ctx2 = document.getElementById('responseChart').getContext('2d');
            responseChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: '响应时间(ms)',
                        data: [],
                        backgroundColor: [
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(139, 92, 246, 0.8)',
                            'rgba(245, 158, 11, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                        ],
                        borderRadius: 6,
                        borderSkipped: false,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false,
                        },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f1f5f9',
                            bodyColor: '#94a3b8',
                            borderColor: '#334155',
                            borderWidth: 1,
                            padding: 12,
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false,
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 10 },
                            }
                        },
                        y: {
                            grid: {
                                color: '#334155',
                                drawBorder: false,
                            },
                            ticks: {
                                color: '#94a3b8',
                                font: { size: 10 },
                            },
                            beginAtZero: true,
                        }
                    }
                }
            });
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                document.getElementById('connectionStatus').className = 'connection-status status-connected';
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-circle"></i><span>已连接</span>';
                console.log('WebSocket connected');
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                updateDashboard(data);
            };

            ws.onclose = function() {
                document.getElementById('connectionStatus').className = 'connection-status status-disconnected';
                document.getElementById('connectionStatus').innerHTML = '<i class="fas fa-circle"></i><span>已断开</span>';
                console.log('WebSocket disconnected');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };
        }

        function updateDashboard(data) {
            updateSummaryCards(data.summary);
            updateCharts(data);
            updateMetricsTable(data.families);
        }

        function updateSummaryCards(summary) {
            const totalRequests = document.getElementById('totalRequests');
            const avgResponseTime = document.getElementById('avgResponseTime');
            const activeConnections = document.getElementById('activeConnections');
            const updateFrequency = document.getElementById('updateFrequency');

            const reqChange = summary.total_requests - lastTotalRequests;
            const reqPercent = lastTotalRequests > 0 ? ((reqChange / lastTotalRequests) * 100).toFixed(1) : 0;
            document.getElementById('requestsChange').innerHTML = 
                `<i class="fas fa-arrow-${reqChange >= 0 ? 'up' : 'down'}"></i>
                <span>${reqChange >= 0 ? '+' : ''}${reqChange} (${reqPercent}%)</span>`;
            document.getElementById('requestsChange').className = `card-change change-${reqChange >= 0 ? 'up' : 'down'}`;

            const respChange = (summary.avg_response_time - lastAvgResponseTime) * 1000;
            document.getElementById('responseChange').innerHTML = 
                `<i class="fas fa-arrow-${respChange <= 0 ? 'down' : 'up'}"></i>
                <span>${respChange <= 0 ? '' : '+'}${respChange.toFixed(2)}ms</span>`;
            document.getElementById('responseChange').className = `card-change change-${respChange <= 0 ? 'down' : 'up'}`;

            totalRequests.textContent = Math.floor(summary.total_requests).toLocaleString();
            avgResponseTime.textContent = (summary.avg_response_time * 1000).toFixed(2) + 'ms';
            activeConnections.textContent = summary.active_connections;
            updateFrequency.textContent = '1次/秒';

            lastTotalRequests = summary.total_requests;
            lastAvgResponseTime = summary.avg_response_time;
        }

        function updateCharts(data) {
            const now = new Date();
            const timeLabel = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            requestsData.push(data.summary.total_requests);
            if (requestsData.length > maxDataPoints) {
                requestsData.shift();
            }

            responseData.push(data.summary.avg_response_time * 1000);
            if (responseData.length > maxDataPoints) {
                responseData.shift();
            }

            const labels = [];
            for (let i = requestsData.length; i > 0; i--) {
                const t = new Date(now.getTime() - (i - 1) * 1000);
                labels.push(t.toLocaleTimeString('zh-CN', { minute: '2-digit', second: '2-digit' }));
            }

            requestsChart.data.labels = labels;
            requestsChart.data.datasets[0].data = [...requestsData];
            requestsChart.update('none');

            const barLabels = ['<50ms', '50-100ms', '100-200ms', '200-500ms', '>500ms'];
            const responseDist = getResponseDistribution(data.families);
            responseChart.data.labels = barLabels;
            responseChart.data.datasets[0].data = responseDist;
            responseChart.update('none');
        }

        function getResponseDistribution(families) {
            const dist = [0, 0, 0, 0, 0];
            for (const family of families) {
                if (family.name && family.name.includes('request_duration')) {
                    for (const metric of family.metrics) {
                        const value = metric.value * 1000;
                        if (value < 50) dist[0]++;
                        else if (value < 100) dist[1]++;
                        else if (value < 200) dist[2]++;
                        else if (value < 500) dist[3]++;
                        else dist[4]++;
                    }
                }
            }
            return dist;
        }

        function updateMetricsTable(families) {
            const tbody = document.getElementById('metricsTableBody');
            tbody.innerHTML = '';

            for (const family of families) {
                for (const metric of family.metrics) {
                    const row = document.createElement('tr');
                    
                    const nameCell = document.createElement('td');
                    nameCell.className = 'metric-name';
                    nameCell.textContent = family.name;
                    
                    const typeCell = document.createElement('td');
                    const typeSpan = document.createElement('span');
                    typeSpan.className = `metric-type type-${family.type ? family.type.toLowerCase() : 'counter'}`;
                    typeSpan.textContent = family.type ? family.type.toLowerCase() : 'counter';
                    typeCell.appendChild(typeSpan);
                    
                    const labelsCell = document.createElement('td');
                    const labels = Object.entries(metric.labels).map(([k, v]) => `${k}="${v}"`).join(', ');
                    labelsCell.textContent = labels || '-';
                    
                    const valueCell = document.createElement('td');
                    valueCell.className = 'metric-value';
                    valueCell.textContent = formatValue(metric.value);
                    
                    const helpCell = document.createElement('td');
                    helpCell.textContent = family.help || '-';
                    
                    row.appendChild(nameCell);
                    row.appendChild(typeCell);
                    row.appendChild(labelsCell);
                    row.appendChild(valueCell);
                    row.appendChild(helpCell);
                    
                    tbody.appendChild(row);
                }
            }
        }

        function formatValue(value) {
            if (value >= 1000000) return (value / 1000000).toFixed(2) + 'M';
            if (value >= 1000) return (value / 1000).toFixed(2) + 'K';
            if (value < 0.001) return value.toExponential(2);
            return value.toFixed(4);
        }

        function toggleTimeRange(seconds) {
            maxDataPoints = seconds;
            if (requestsData.length > maxDataPoints) {
                requestsData = requestsData.slice(-maxDataPoints);
            }
            if (responseData.length > maxDataPoints) {
                responseData = responseData.slice(-maxDataPoints);
            }
        }

        function refreshMetrics() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send('refresh');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            connectWebSocket();
        });
    </script>
</body>
</html>
